# Environment for Notebook.link (JupyterLite / xeus-python, WebAssembly).
# Solved in-browser by mambajs against emscripten-forge + conda-forge noarch.
#
# NOTE: channel order matters. emscripten-forge MUST come first: under strict
# channel priority, listing conda-forge first makes pyyaml resolve to the
# conda-forge build, which needs the `yaml` C library that has no
# emscripten-wasm32 build -> otter-grader-base becomes unsolvable.
#
# This file is separate from the repo-root environment.yml, which targets
# Berkeley DataHub and contains packages that cannot run in WASM.
name: xeus-kernel
channels:
  - https://repo.prefix.dev/emscripten-forge-dev
  - https://repo.prefix.dev/conda-forge
dependencies:
  - ipython<9
  - xeus-python
  - datascience==0.18.1
  - otter-grader-base
  - numpy==2.2.6
  - scipy==1.14.1
  - urllib3<2.0
